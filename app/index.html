<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>timptr.ru pattern test</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050712;
        color: #f5f7ff;
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }

      .panel {
        position: relative;
        z-index: 1;
        display: grid;
        min-height: 100%;
        place-items: center;
        padding: 24px;
        pointer-events: none;
      }

      .card {
        width: min(680px, 100%);
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 32px;
        background: rgb(6 9 22 / 58%);
        box-shadow: 0 24px 90px rgb(0 0 0 / 42%);
        text-align: center;
        backdrop-filter: blur(18px);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(40px, 8vw, 88px);
        line-height: 0.92;
        letter-spacing: -0.07em;
      }

      p {
        margin: 0;
        color: rgb(245 247 255 / 76%);
        font-size: clamp(16px, 2vw, 21px);
        line-height: 1.55;
      }

      .badge {
        display: inline-block;
        margin-bottom: 20px;
        padding: 8px 12px;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 999px;
        color: rgb(245 247 255 / 70%);
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 28px;
      }

      .links a {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 132px;
        padding: 12px 18px;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 999px;
        background: rgb(255 255 255 / 10%);
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
        transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
      }

      .links a:hover,
      .links a:focus-visible {
        border-color: rgb(255 255 255 / 42%);
        background: rgb(255 255 255 / 18%);
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <canvas id="pattern" aria-hidden="true"></canvas>
    <main class="panel">
      <section class="card">
        <span class="badge">timptr.ru</span>
        <h1>Привет!</h1>
        <p>Тут нечего смотреть</p>
        <nav class="links" aria-label="Социальные ссылки">
          <a href="https://t.me/timptr_channel" rel="noopener noreferrer">Telegram</a>
          <a href="https://vk.com/timptr" rel="noopener noreferrer">VK</a>
        </nav>
      </section>
    </main>
    <script>
      const canvas = document.getElementById("pattern");
      const ctx = canvas.getContext("2d");
      const pointer = { x: 0.5, y: 0.5 };

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener("resize", resize);
      window.addEventListener("pointermove", (event) => {
        pointer.x = event.clientX / window.innerWidth;
        pointer.y = event.clientY / window.innerHeight;
      });

      function draw(time) {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const tick = time * 0.001;
        const step = Math.max(22, Math.min(width, height) / 24);

        const gradient = ctx.createRadialGradient(
          width * pointer.x,
          height * pointer.y,
          0,
          width * 0.5,
          height * 0.5,
          Math.max(width, height)
        );
        gradient.addColorStop(0, "#17245a");
        gradient.addColorStop(0.45, "#080d24");
        gradient.addColorStop(1, "#02030a");

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        for (let y = -step; y < height + step; y += step) {
          for (let x = -step; x < width + step; x += step) {
            const wave = Math.sin(x * 0.012 + tick) + Math.cos(y * 0.014 - tick * 1.25);
            const radius = step * (0.22 + Math.abs(Math.sin(wave + tick)) * 0.46);
            const hue = (tick * 42 + x * 0.09 + y * 0.05) % 360;

            ctx.beginPath();
            ctx.arc(
              x + Math.sin(tick + y * 0.01) * step * 0.3,
              y + Math.cos(tick + x * 0.01) * step * 0.3,
              radius,
              0,
              Math.PI * 2
            );
            ctx.fillStyle = `hsl(${hue} 92% 62% / 0.16)`;
            ctx.fill();
          }
        }

        ctx.globalCompositeOperation = "screen";
        for (let i = 0; i < 7; i += 1) {
          const angle = tick * (0.35 + i * 0.04) + i;
          const x = width * (0.5 + Math.cos(angle) * 0.28);
          const y = height * (0.5 + Math.sin(angle * 1.3) * 0.24);
          const glow = ctx.createRadialGradient(x, y, 0, x, y, Math.max(width, height) * 0.32);
          glow.addColorStop(0, `hsl(${(tick * 55 + i * 48) % 360} 95% 68% / 0.24)`);
          glow.addColorStop(1, "transparent");
          ctx.fillStyle = glow;
          ctx.fillRect(0, 0, width, height);
        }
        ctx.globalCompositeOperation = "source-over";

        requestAnimationFrame(draw);
      }

      resize();
      requestAnimationFrame(draw);
    </script>
  </body>
</html>
